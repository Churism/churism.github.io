<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Descubre los mejores destinos turísticos del mundo">
    <title>Mi Sitio Web - Destinos</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">

    <style>
        /* =============================================
           VARIABLES CSS
           ============================================= */
        :root {
            --bg-color: #fafafa;
            --text-color: #000000;
            --navbar-bg: #f5f5f5;
            --navbar-text: #000000;
            --btn-bg: #ff7227;
            --btn-text: #ffffff;
            --card-bg: #ffffff;
            --card-shadow: rgba(0,0,0,0.08);
            --footer-bg: #1a1a1a;
            --footer-text: #ffffff;
            --accent-color: #ff7227;
            --filter-bg: #e9ecef;
            --price-color: #28a745;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #ffffff;
            --navbar-bg: #1a1a1a;
            --navbar-text: #ffffff;
            --card-bg: #1e1e1e;
            --card-shadow: rgba(0,0,0,0.3);
            --footer-bg: #0a0a0a;
            --footer-text: #ffffff;
            --filter-bg: #2a2a2a;
            --price-color: #4ade80;
        }

        /* =============================================
           RESET Y BASE
           ============================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Mochiy Pop One', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        img { max-width: 100%; display: block; }
        ul { list-style: none; }

        /* =============================================
           NAVBAR
           ============================================= */
        .navbar {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 1200px;
            background: var(--navbar-bg); z-index: 1000; height: 70px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px; border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); transition: all 0.3s ease;
        }
        .navbar:hover {
            box-shadow: 0 6px 30px rgba(0,0,0,0.15);
            transform: translateX(-50%) translateY(-2px);
        }
        .nav-links { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .nav-links a {
            color: var(--navbar-text); font-weight: bold; text-transform: uppercase;
            font-size: 13px; padding: 8px 16px; border-radius: 25px; transition: all 0.3s ease;
        }
        .nav-links a:hover { background: var(--btn-bg); color: var(--btn-text); transform: translateY(-2px); }

        .theme-toggle {
            background: transparent; border: 2px solid var(--navbar-text);
            color: var(--navbar-text); width: 45px; height: 45px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 20px; transition: all 0.3s ease; margin-left: 15px;
        }
        .theme-toggle:hover {
            background: var(--btn-bg); color: var(--btn-text);
            transform: rotate(15deg) scale(1.1); border-color: var(--btn-bg);
        }
        .theme-toggle .icon-sun { display: none; }
        .theme-toggle .icon-moon { display: block; }
        body.dark-mode .theme-toggle .icon-sun { display: block; }
        body.dark-mode .theme-toggle .icon-moon { display: none; }

        /* =============================================
           HERO
           ============================================= */
        .destinations-hero {
            position: relative; height: 50vh; min-height: 350px;
            width: 100%; overflow: hidden; margin-top: 0;
        }
        .destinations-hero img {
            width: 100%; height: 100%; object-fit: cover;
            position: absolute; z-index: 1;
        }
        .destinations-hero::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
            z-index: 2;
        }
        .destinations-hero-content {
            position: relative; z-index: 3; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; color: #fff; padding: 20px;
        }
        .destinations-hero-content h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            text-transform: uppercase; margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .destinations-hero-content p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            max-width: 600px; text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        /* =============================================
           FILTROS
           ============================================= */
        .destinations-filters {
            padding: 30px 20px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .filter-btn {
            padding: 10px 24px;
            background: var(--filter-bg);
            color: var(--text-color);
            border: 2px solid transparent;
            border-radius: 25px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--btn-bg);
            color: var(--btn-text);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255,114,39,0.3);
        }

        /* =============================================
           GRID DE DESTINOS CON FLIP CARDS
           ============================================= */
        .destinations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 35px;
            max-width: 1200px;
            margin: 0 auto 60px;
            padding: 0 20px;
            perspective: 1000px;
        }

        .destination-card {
            height: 450px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .destination-card:hover {
            transform: rotateY(180deg);
        }

        .destination-card-front,
        .destination-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 8px 25px var(--card-shadow);
        }

        /* FRONTAL DE LA TARJETA */
        .destination-card-front {
            background: var(--card-bg);
        }

        .destination-image {
            width: 100%;
            height: 280px;
            overflow: hidden;
            position: relative;
        }

        .destination-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .destination-card:hover .destination-image img {
            transform: scale(1.1);
        }

        .destination-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--btn-bg);
            color: var(--btn-text);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 2;
        }

        .destination-rating {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.95);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 2;
        }

        .destination-info {
            padding: 20px;
        }

        .destination-location {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--location-color, #6c757d);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .destination-title {
            font-size: 1.3rem;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .destination-price-preview {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-top: 15px;
        }

        .destination-price-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--price-color);
        }

        .destination-price-original {
            font-size: 1rem;
            text-decoration: line-through;
            opacity: 0.6;
        }

        .destination-hint {
            text-align: center;
            padding: 12px;
            background: var(--filter-bg);
            font-size: 0.85rem;
            opacity: 0.8;
        }

        /* REVERSO DE LA TARJETA */
        .destination-card-back {
            background: linear-gradient(135deg, var(--btn-bg) 0%, #ff8c42 100%);
            color: white;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }

        .destination-back-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .destination-back-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .destination-back-description {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            opacity: 0.95;
        }

        .destination-back-features {
            list-style: none;
            margin-bottom: 25px;
            text-align: left;
            width: 100%;
        }

        .destination-back-features li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .destination-back-features li:last-child {
            border-bottom: none;
        }

        .destination-btn-view {
            padding: 12px 35px;
            background: white;
            color: var(--btn-bg);
            border: none;
            border-radius: 30px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .destination-btn-view:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        /* ESTADO DE CARGA */
        .destinations-loading {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* =============================================
           FOOTER
           ============================================= */
        footer {
            background: var(--footer-bg);
            color: var(--footer-text);
            text-align: center;
            padding: 50px 20px;
            margin: auto 20px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-top: auto;
        }
        footer:hover {
            box-shadow: 0 6px 30px rgba(0,0,0,0.2);
            transform: translateY(-3px);
        }
        footer a { color: var(--footer-text); text-decoration: underline; }
        footer a:hover { opacity: 0.8; }

        /* =============================================
           RESPONSIVE
           ============================================= */
        @media (max-width: 768px) {
            .navbar {
                top: 10px; width: calc(100% - 20px);
                flex-direction: column; height: auto; padding: 15px; border-radius: 30px;
            }
            .nav-links { margin: 15px 0; gap: 10px; }
            .nav-links a { padding: 6px 12px; font-size: 11px; }
            .theme-toggle { margin: 10px auto 0; }

            .destinations-hero { height: 40vh; min-height: 280px; }
            .destinations-hero-content h1 { font-size: 2rem; }

            .destinations-grid {
                grid-template-columns: 1fr;
                perspective: 1000px;
            }

            .destination-card {
                height: 400px;
            }

            footer { margin: 40px 10px 10px; border-radius: 20px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="/index">Inicio</a></li>
            <li><a href="/about">Nosotros</a></li>
            <li><a href="/index#servicios">Servicios</a></li>
            <li><a href="/index#galeria">Galería</a></li>
            <li><a href="/destinations" style="background:var(--btn-bg);color:var(--btn-text);">Destinos</a></li>
            <li><a href="/contact">Contacto</a></li>
            <li><a href="/blog">Blog</a></li>
        </ul>
        <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
            <span class="icon-sun">☀️</span><span class="icon-moon">🌙</span>
        </button>
    </nav>

    <!-- HERO -->
    <section class="destinations-hero">
        <img src="Images/destinations/hero-destinations.jpg" alt="Destinos Turísticos">
        <div class="destinations-hero-content">
            <h1>🌍 Explora el Mundo</h1>
            <p>Descubre los destinos más increíbles y vive experiencias inolvidables</p>
        </div>
    </section>

    <!-- FILTROS -->
    <section class="destinations-filters">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="playa">🏖️ Playas</button>
        <button class="filter-btn" data-filter="montana">⛰️ Montañas</button>
        <button class="filter-btn" data-filter="ciudad">🏙️ Ciudades</button>
        <button class="filter-btn" data-filter="relax">🧘 Relax</button>
    </section>

    <!-- GRID DE DESTINOS -->
    <main class="destinations-grid" id="destinationsGrid">
        <div class="destinations-loading" id="destinationsLoading">Cargando destinos... 🌍</div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        // TEMA DÍA/NOCHE
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') body.classList.add('dark-mode');
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
        });

        // CARGAR DESTINOS DESDE JSON
        async function loadDestinations() {
            const grid = document.getElementById('destinationsGrid');
            const loading = document.getElementById('destinationsLoading');
            
            try {
                const response = await fetch('destinations/destinations.json');
                if (!response.ok) throw new Error('No se pudo cargar destinations.json');
                
                const destinations = await response.json();
                loading.style.display = 'none';
                
                grid.innerHTML = destinations.map(dest => `
                    <article class="destination-card" data-category="${dest.category}" data-slug="${dest.slug}">
                        <!-- FRONTAL -->
                        <div class="destination-card-front">
                            <div class="destination-image">
                                <img src="${dest.image}" alt="${dest.title}" loading="lazy">
                                ${dest.badge ? `<span class="destination-badge">${dest.badge}</span>` : ''}
                                <div class="destination-rating">⭐ ${dest.rating}</div>
                            </div>
                            <div class="destination-info">
                                <div class="destination-location">📍 ${dest.location}</div>
                                <h3 class="destination-title">${dest.title}</h3>
                                <div class="destination-price-preview">
                                    <span class="destination-price-value">$${dest.price}</span>
                                    ${dest.priceOriginal ? `<span class="destination-price-original">$${dest.priceOriginal}</span>` : ''}
                                </div>
                            </div>
                            <div class="destination-hint">👆 Haz hover para ver más</div>
                        </div>
                        
                        <!-- REVERSO -->
                        <div class="destination-card-back">
                            <div class="destination-back-icon">🌟</div>
                            <h3 class="destination-back-title">${dest.title}</h3>
                            <p class="destination-back-description">${dest.excerpt}</p>
                            <ul class="destination-back-features">
                                <li>📅 ${dest.duration}</li>
                                <li>👥 ${dest.groupSize}</li>
                                <li>⭐ ${dest.rating} (${dest.reviews} reseñas)</li>
                                <li>💰 Desde $${dest.price}</li>
                            </ul>
                            <button class="destination-btn-view" onclick="window.location.href='destinations/destination-detail.html?slug=${dest.slug}'">
                                Ver Detalles →
                            </button>
                        </div>
                    </article>
                `).join('');
                
                // Añadir listeners para filtros
                addFilterListeners();
                
            } catch (error) {
                console.error('Error cargando destinos:', error);
                loading.textContent = 'Error cargando destinos. Intenta recargar. ❌';
            }
        }

        // FILTROS
        function addFilterListeners() {
            const filterBtns = document.querySelectorAll('.filter-btn');
            const cards = document.querySelectorAll('.destination-card');
            
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    const filter = btn.dataset.filter;
                    
                    cards.forEach(card => {
                        if (filter === 'all' || card.dataset.category === filter) {
                            card.style.display = 'block';
                        } else {
                            card.style.display = 'none';
                        }
                    });
                });
            });
        }

        // Cargar al iniciar
        document.addEventListener('DOMContentLoaded', loadDestinations);
    </script>
</body>
</html>
