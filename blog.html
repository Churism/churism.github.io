<!DOCTYPE html>
<html lang="es">
<head>
    <!-- =============================================
         META TAGS Y CONFIGURACIÓN BÁSICA
         ============================================= -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blog - Noticias, tutoriales y actualizaciones">
    <title>Mi Sitio Web - Blog</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <!-- =============================================
         FUENTES DE GOOGLE FONTS
         ============================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">

    <!-- =============================================
         ESTILOS CSS
         ============================================= -->
    <style>
        /* =============================================
           VARIABLES CSS - TEMA DÍA
           ============================================= */
        :root {
            --bg-color: #fafafa;
            --text-color: #000000;
            --navbar-bg: #f5f5f5;
            --navbar-text: #000000;
            --btn-bg: #ff7227;
            --btn-text: #ffffff;
            --card-bg: #ffffff;
            --card-shadow: rgba(0,0,0,0.08);
            --footer-bg: #1a1a1a;
            --footer-text: #ffffff;
            --accent-color: #ff7227;
            --tag-bg: #ffe8d9;
            --tag-text: #cc5b00;
        }

        /* =============================================
           VARIABLES CSS - TEMA NOCHE
           ============================================= */
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #ffffff;
            --navbar-bg: #1a1a1a;
            --navbar-text: #ffffff;
            --btn-bg: #ff7227;
            --btn-text: #ffffff;
            --card-bg: #1e1e1e;
            --card-shadow: rgba(0,0,0,0.3);
            --footer-bg: #0a0a0a;
            --footer-text: #ffffff;
            --accent-color: #ff7227;
            --tag-bg: #3d2a1f;
            --tag-text: #ffb380;
        }

        /* =============================================
           RESET Y BASE
           ============================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Mochiy Pop One', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        img { max-width: 100%; display: block; }
        ul { list-style: none; }

        /* =============================================
           NAVBAR
           ============================================= */
        .navbar {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 1200px;
            background: var(--navbar-bg); z-index: 1000; height: 70px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px; border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); transition: all 0.3s ease;
        }
        .navbar:hover {
            box-shadow: 0 6px 30px rgba(0,0,0,0.15);
            transform: translateX(-50%) translateY(-2px);
        }
        .nav-links { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .nav-links a {
            color: var(--navbar-text); font-weight: bold; text-transform: uppercase;
            font-size: 13px; padding: 8px 16px; border-radius: 25px; transition: all 0.3s ease;
        }
        .nav-links a:hover { background: var(--btn-bg); color: var(--btn-text); transform: translateY(-2px); }

        /* =============================================
           BOTÓN TEMA
           ============================================= */
        .theme-toggle {
            background: transparent; border: 2px solid var(--navbar-text);
            color: var(--navbar-text); width: 45px; height: 45px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 20px; transition: all 0.3s ease; margin-left: 15px;
        }
        .theme-toggle:hover {
            background: var(--btn-bg); color: var(--btn-text);
            transform: rotate(15deg) scale(1.1); border-color: var(--btn-bg);
        }
        .theme-toggle .icon-sun { display: none; }
        .theme-toggle .icon-moon { display: block; }
        body.dark-mode .theme-toggle .icon-sun { display: block; }
        body.dark-mode .theme-toggle .icon-moon { display: none; }

        /* =============================================
           HERO DEL BLOG
           ============================================= */
        .blog-hero {
            position: relative; height: 50vh; min-height: 300px;
            width: 100%; overflow: hidden; margin-top: 0;
        }
        .blog-hero img {
            width: 100%; height: 100%; object-fit: cover;
            position: absolute; z-index: 1;
        }
        .blog-hero::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.5) 100%);
            z-index: 2;
        }
        .blog-hero-content {
            position: relative; z-index: 3; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; color: #fff; padding: 20px;
        }
        .blog-hero-content h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            text-transform: uppercase; margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .blog-hero-content p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            max-width: 600px; text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        /* =============================================
           FILTROS DE TAGS
           ============================================= */
        .tags-filter {
            padding: 30px 20px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .tag-btn {
            padding: 8px 20px;
            background: var(--tag-bg);
            color: var(--tag-text);
            border: none;
            border-radius: 20px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tag-btn:hover, .tag-btn.active {
            background: var(--btn-bg);
            color: var(--btn-text);
            transform: translateY(-2px);
        }

        /* =============================================
           GRID DE POSTS
           ============================================= */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto 60px;
            padding: 0 20px;
        }

        .post-card {
            background: var(--card-bg);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 4px 15px var(--card-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .post-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .post-card-image {
            width: 100%;
            height: 200px;
            overflow: hidden;
        }
        .post-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .post-card:hover .post-card-image img { transform: scale(1.05); }
        
        .post-card-content {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .post-card-date {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 10px;
        }
        .post-card-title {
            font-size: 1.3rem;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .post-card-title a:hover { opacity: 0.8; }
        .post-card-excerpt {
            font-size: 0.95rem;
            opacity: 0.85;
            margin-bottom: 15px;
            flex-grow: 1;
        }
        .post-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        .post-tag {
            padding: 4px 12px;
            background: var(--tag-bg);
            color: var(--tag-text);
            border-radius: 15px;
            font-size: 0.8rem;
        }
        .post-card-read {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--accent-color);
            font-weight: bold;
            margin-top: auto;
        }
        .post-card-read:hover { opacity: 0.8; }

        /* =============================================
           ESTADO: CARGANDO / SIN POSTS
           ============================================= */
        .posts-loading, .posts-empty {
            text-align: center;
            padding: 60px 20px;
            max-width: 600px;
            margin: 0 auto;
            opacity: 0.8;
        }
        .posts-empty { display: none; }

        /* =============================================
           FOOTER
           ============================================= */
        footer {
            background: var(--footer-bg);
            color: var(--footer-text);
            text-align: center;
            padding: 50px 20px;
            margin: auto 20px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-top: auto;
        }
        footer:hover {
            box-shadow: 0 6px 30px rgba(0,0,0,0.2);
            transform: translateY(-3px);
        }
        footer a { color: var(--footer-text); text-decoration: underline; }
        footer a:hover { opacity: 0.8; }

        /* =============================================
           RESPONSIVE
           ============================================= */
        @media (max-width: 768px) {
            .navbar {
                top: 10px; width: calc(100% - 20px);
                flex-direction: column; height: auto; padding: 15px; border-radius: 30px;
            }
            .nav-links { margin: 15px 0; gap: 10px; }
            .nav-links a { padding: 6px 12px; font-size: 11px; }
            .theme-toggle { margin: 10px auto 0; }
            .blog-hero { height: 40vh; min-height: 250px; }
            .blog-hero-content h1 { font-size: 2rem; }
            .posts-grid { grid-template-columns: 1fr; }
            footer { margin: 40px 10px 10px; border-radius: 20px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="about.html">Nosotros</a></li>
            <li><a href="index.html#servicios">Servicios</a></li>
            <li><a href="index.html#galeria">Galería</a></li>
            <li><a href="contact.html">Contacto</a></li>
            <li><a href="blog.html" style="background:var(--btn-bg);color:var(--btn-text);">Blog</a></li>
        </ul>
        <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
            <span class="icon-sun">☀️</span><span class="icon-moon">🌙</span>
        </button>
    </nav>

    <!-- HERO -->
    <section class="blog-hero">
        <img src="/blog-hero.jpg" alt="Blog Header">
        <div class="blog-hero-content">
            <h1>✨ Nuestro Blog ✨</h1>
            <p>Noticias, tutoriales y reflexiones sobre nuestro trabajo</p>
        </div>
    </section>

    <!-- FILTROS DE TAGS -->
    <section class="tags-filter" id="tagsFilter">
        <button class="tag-btn active" data-tag="all">Todos</button>
        <!-- Los tags se generan dinámicamente con JS -->
    </section>

    <!-- GRID DE POSTS -->
    <main class="posts-grid" id="postsGrid">
        <div class="posts-loading" id="postsLoading">Cargando entradas... 🌸</div>
        <div class="posts-empty" id="postsEmpty">Aún no hay entradas. ¡Pronto tendremos novedades! ✨</div>
        <!-- Los posts se generan dinámicamente con JS -->
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>

    <!-- =============================================
         JAVASCRIPT - CARGA DINÁMICA DE POSTS
         ============================================= -->
    <script>
        /* =============================================
           CONFIGURACIÓN
           ============================================= */
        const POSTS_JSON_URL = 'posts/posts.json';  // Ruta al archivo JSON con los posts
        const MAX_EXCERPT_LENGTH = 120;              // Longitud máxima del extracto

        /* =============================================
           FUNCIONES AUXILIARES
           ============================================= */
        
        /**
         * Formatea una fecha ISO a formato legible en español
         * @param {string} dateString - Fecha en formato ISO (YYYY-MM-DD)
         * @returns {string} Fecha formateada (ej: "1 jun 2026")
         */
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('es-ES', { 
                day: 'numeric', 
                month: 'short', 
                year: 'numeric' 
            });
        }

        /**
         * Trunca un texto a una longitud máxima añadiendo "..."
         * @param {string} text - Texto original
         * @param {number} maxLength - Longitud máxima
         * @returns {string} Texto truncado
         */
        function truncateText(text, maxLength) {
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength).trim() + '...';
        }

        /**
         * Genera el HTML para una tarjeta de post
         * @param {Object} post - Objeto con datos del post
         * @returns {string} HTML de la tarjeta
         */
        function createPostCard(post) {
            const tagsHTML = post.tags.map(tag => 
                `<span class="post-tag" data-tag="${tag}">${tag}</span>`
            ).join('');
            
            return `
                <article class="post-card" data-tags="${post.tags.join(',')}">
                    <a href="${post.url}" class="post-card-image">
                        <img src="${post.image}" alt="${post.title}" loading="lazy">
                    </a>
                    <div class="post-card-content">
                        <time class="post-card-date" datetime="${post.date}">${formatDate(post.date)}</time>
                        <h3 class="post-card-title">
                            <a href="${post.url}">${post.title}</a>
                        </h3>
                        <p class="post-card-excerpt">${truncateText(post.excerpt, MAX_EXCERPT_LENGTH)}</p>
                        <div class="post-card-tags">${tagsHTML}</div>
                        <a href="${post.url}" class="post-card-read">Leer más →</a>
                    </div>
                </article>
            `;
        }

        /**
         * Genera los botones de filtro de tags únicos
         * @param {Array} posts - Array de posts
         */
        function generateTagFilters(posts) {
            const tagsFilter = document.getElementById('tagsFilter');
            const allTags = [...new Set(posts.flatMap(post => post.tags))];
            
            allTags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'tag-btn';
                btn.dataset.tag = tag;
                btn.textContent = tag;
                tagsFilter.appendChild(btn);
            });
        }

        /**
         * Filtra los posts por tag seleccionado
         * @param {string} selectedTag - Tag seleccionado o "all"
         */
        function filterPosts(selectedTag) {
            const cards = document.querySelectorAll('.post-card');
            const tagBtns = document.querySelectorAll('.tag-btn');
            
            // Actualizar estado visual de botones
            tagBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tag === selectedTag);
            });
            
            // Mostrar/ocultar cards según filtro
            cards.forEach(card => {
                const tags = card.dataset.tags.split(',');
                const shouldShow = selectedTag === 'all' || tags.includes(selectedTag);
                card.style.display = shouldShow ? 'flex' : 'none';
            });
        }

        /* =============================================
           CARGA Y RENDERIZADO DE POSTS
           ============================================= */
        
        async function loadPosts() {
            const postsGrid = document.getElementById('postsGrid');
            const postsLoading = document.getElementById('postsLoading');
            const postsEmpty = document.getElementById('postsEmpty');
            
            try {
                // Fetch del archivo JSON
                const response = await fetch(POSTS_JSON_URL);
                if (!response.ok) throw new Error('No se pudo cargar posts.json');
                
                let posts = await response.json();
                
                // Ordenar por fecha (más recientes primero)
                posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                // Ocultar loading
                postsLoading.style.display = 'none';
                
                if (posts.length === 0) {
                    postsEmpty.style.display = 'block';
                    return;
                }
                
                // Generar filtros de tags
                generateTagFilters(posts);
                
                // Renderizar cards
                postsGrid.innerHTML = posts.map(createPostCard).join('');
                
                // Añadir listeners a los filtros
                document.querySelectorAll('.tag-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        filterPosts(e.target.dataset.tag);
                    });
                });
                
            } catch (error) {
                console.error('Error cargando posts:', error);
                postsLoading.textContent = 'Error cargando entradas. Intenta recargar la página. ❌';
            }
        }

        /* =============================================
           CAMBIO DE TEMA DÍA/NOCHE
           ============================================= */
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') body.classList.add('dark-mode');
        
        themeToggle.addEventListener('click', function() {
            body.classList.toggle('dark-mode');
            localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
        });

        /* =============================================
           INICIALIZACIÓN
           ============================================= */
        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
</html>
