<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Destino</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #fafafa; --text-color: #000000; --navbar-bg: #f5f5f5; --navbar-text: #000000; --btn-bg: #ff7227; --btn-text: #ffffff; --card-bg: #ffffff; --card-shadow: rgba(0,0,0,0.08); --footer-bg: #1a1a1a; --footer-text: #ffffff; --price-color: #28a745; }
        body.dark-mode { --bg-color: #121212; --text-color: #ffffff; --navbar-bg: #1a1a1a; --navbar-text: #ffffff; --card-bg: #1e1e1e; --card-shadow: rgba(0,0,0,0.3); --footer-bg: #0a0a0a; --price-color: #4ade80; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Mochiy Pop One', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; transition: 0.3s; min-height: 100vh; display: flex; flex-direction: column; }
        a { text-decoration: none; color: inherit; } img { max-width: 100%; display: block; } ul { list-style: none; }

        .navbar { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 1200px; background: var(--navbar-bg); z-index: 1000; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; border-radius: 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .nav-links { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .nav-links a { color: var(--navbar-text); font-weight: bold; text-transform: uppercase; font-size: 13px; padding: 8px 16px; border-radius: 25px; }
        .nav-links a:hover { background: var(--btn-bg); color: var(--btn-text); }
        .theme-toggle { background: transparent; border: 2px solid var(--navbar-text); color: var(--navbar-text); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-left: 15px; }
        .theme-toggle .icon-sun { display: none; } .theme-toggle .icon-moon { display: block; }
        body.dark-mode .theme-toggle .icon-sun { display: block; } body.dark-mode .theme-toggle .icon-moon { display: none; }

        .detail-container { max-width: 1200px; margin: 120px auto 60px; padding: 0 20px; display: grid; grid-template-columns: 1fr 380px; gap: 40px; }
        
        .detail-main { background: var(--card-bg); border-radius: 25px; padding: 35px; box-shadow: 0 4px 20px var(--card-shadow); }
        .detail-image { width: 100%; height: 400px; border-radius: 20px; overflow: hidden; margin-bottom: 30px; }
        .detail-image img { width: 100%; height: 100%; object-fit: cover; }
        .detail-title { font-size: 2.2rem; margin-bottom: 15px; line-height: 1.3; }
        .detail-location { display: flex; align-items: center; gap: 8px; color: #6c757d; font-size: 1rem; margin-bottom: 10px; }
        .detail-meta { display: flex; gap: 25px; flex-wrap: wrap; margin-bottom: 25px; padding-bottom: 25px; border-bottom: 2px solid var(--card-shadow); }
        .detail-meta-item { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
        .detail-description { font-size: 1.05rem; line-height: 1.8; margin-bottom: 30px; white-space: pre-line; }
        .detail-section { margin-bottom: 35px; }
        .detail-section h3 { font-size: 1.5rem; margin-bottom: 20px; color: var(--btn-bg); }
        .detail-list li { padding: 10px 0; padding-left: 30px; position: relative; border-bottom: 1px solid var(--card-shadow); }
        .detail-list li::before { content: '✓'; position: absolute; left: 0; color: var(--price-color); font-weight: bold; font-size: 1.2rem; }
        .detail-list.not-included li::before { content: '✗'; color: #dc3545; }

        .detail-sidebar { position: sticky; top: 110px; height: fit-content; }
        .detail-price-card { background: var(--card-bg); border-radius: 25px; padding: 30px; box-shadow: 0 4px 20px var(--card-shadow); }
        .detail-price-header { text-align: center; margin-bottom: 25px; padding-bottom: 25px; border-bottom: 2px solid var(--card-shadow); }
        .detail-price-label { font-size: 1rem; opacity: 0.8; margin-bottom: 10px; }
        .detail-price-value { font-size: 3rem; font-weight: bold; color: var(--price-color); line-height: 1; }
        .detail-price-original { font-size: 1.3rem; text-decoration: line-through; opacity: 0.6; margin-top: 5px; }
        .detail-price-discount { display: inline-block; background: var(--btn-bg); color: var(--btn-text); padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; margin-top: 10px; font-weight: bold; }
        .detail-features-short ul { list-style: none; margin-bottom: 25px; }
        .detail-features-short li { padding: 8px 0; display: flex; align-items: center; gap: 10px; }
        .detail-btn-book { width: 100%; padding: 18px; background: var(--btn-bg); color: var(--btn-text); border: none; border-radius: 30px; font-family: inherit; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 15px; }
        .detail-btn-book:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(255,114,39,0.4); }
        .detail-btn-contact { width: 100%; padding: 15px; background: transparent; color: var(--text-color); border: 2px solid var(--btn-bg); border-radius: 30px; font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .detail-btn-contact:hover { background: var(--btn-bg); color: var(--btn-text); }
        .detail-guarantee { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 2px solid var(--card-shadow); font-size: 0.9rem; opacity: 0.8; }

        footer { background: var(--footer-bg); color: var(--footer-text); text-align: center; padding: 50px 20px; margin: auto 20px 20px; border-radius: 30px; font-size: 0.95rem; margin-top: auto; }

        @media (max-width: 968px) {
            .detail-container { grid-template-columns: 1fr; margin-top: 100px; }
            .detail-sidebar { position: static; }
        }
        @media (max-width: 768px) {
            .navbar { top: 10px; width: calc(100% - 20px); flex-direction: column; height: auto; padding: 15px; border-radius: 30px; }
            .nav-links { margin: 15px 0; gap: 10px; } .nav-links a { padding: 6px 12px; font-size: 11px; } .theme-toggle { margin: 10px auto 0; }
            .detail-main { padding: 25px; } .detail-title { font-size: 1.8rem; } .detail-price-value { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="../about.html">Nosotros</a></li>
            <li><a href="../destinations.html">Destinos</a></li>
            <li><a href="../contact.html">Contacto</a></li>
        </ul>
        <button class="theme-toggle" id="themeToggle"><span class="icon-sun">☀️</span><span class="icon-moon">🌙</span></button>
    </nav>

    <main class="detail-container" id="detailContainer">
        <div style="grid-column:1/-1; text-align:center; padding:60px;">Cargando destino... 🌍</div>
    </main>

    <footer><p>&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</p></footer>

    <script>
        // TEMA
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        if (localStorage.getItem('theme') === 'dark') body.classList.add('dark-mode');
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
        });

        // CARGAR DETALLE DESDE JSON
        async function loadDetail() {
            const container = document.getElementById('detailContainer');
            const slug = new URLSearchParams(window.location.search).get('slug');
            
            if (!slug) { container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;">❌ Destino no especificado</div>'; return; }
            
            try {
                const response = await fetch('destinations.json');
                const destinations = await response.json();
                const dest = destinations.find(d => d.slug === slug);
                
                if (!dest) { container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;">❌ Destino no encontrado</div>'; return; }
                
                const discount = dest.priceOriginal ? Math.round(((dest.priceOriginal - dest.price) / dest.priceOriginal) * 100) : 0;
                
                container.innerHTML = `
                    <div class="detail-main">
                        <div class="detail-image"><img src="${dest.image}" alt="${dest.title}"></div>
                        <div class="detail-location">📍 ${dest.location}</div>
                        <h1 class="detail-title">${dest.title}</h1>
                        <div class="detail-meta">
                            <div class="detail-meta-item">📅 ${dest.duration}</div>
                            <div class="detail-meta-item">👥 ${dest.groupSize}</div>
                            <div class="detail-meta-item">⭐ ${dest.rating} (${dest.reviews} reseñas)</div>
                        </div>
                        <div class="detail-description">${dest.description}</div>
                        
                        <div class="detail-section">
                            <h3>📋 Itinerario</h3>
                            <ul class="detail-list">${dest.itinerary.map(i => `<li>${i}</li>`).join('')}</ul>
                        </div>
                        <div class="detail-section">
                            <h3>✅ Incluye</h3>
                            <ul class="detail-list">${dest.included.map(i => `<li>${i}</li>`).join('')}</ul>
                        </div>
                        <div class="detail-section">
                            <h3>❌ No Incluye</h3>
                            <ul class="detail-list not-included">${dest.notIncluded.map(i => `<li>${i}</li>`).join('')}</ul>
                        </div>
                    </div>
                    
                    <aside class="detail-sidebar">
                        <div class="detail-price-card">
                            <div class="detail-price-header">
                                <div class="detail-price-label">Precio por persona</div>
                                <div class="detail-price-value">$${dest.price}</div>
                                ${dest.priceOriginal ? `<div class="detail-price-original">$${dest.priceOriginal}</div><div class="detail-price-discount">Ahorra ${discount}%</div>` : ''}
                            </div>
                            <div class="detail-features-short">
                                <h4>Características:</h4>
                                <ul>${dest.features.map(f => `<li>${f}</li>`).join('')}</ul>
                            </div>
                            <button class="detail-btn-book" onclick="alert('🎉 ¡Redirigiendo a pasarela de pago para: ${dest.title}!')">🛒 Reservar Ahora</button>
                            <button class="detail-btn-contact" onclick="window.location.href='../contact.html'">💬 Consultar Dudas</button>
                            <div class="detail-guarantee">🔒 Pago seguro garantizado<br>✈️ Cancelación gratuita hasta 7 días antes</div>
                        </div>
                    </aside>
                `;
                document.title = `${dest.title} - Mi Sitio Web`;
            } catch (error) {
                container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;">❌ Error cargando el destino</div>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadDetail);
    </script>
</body>
</html>
