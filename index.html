<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sitio web profesional con modo día/noche">
    <title>Mi Sitio Web - Landing Page</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">

    <style>
        /* =============================================
           VARIABLES CSS - TEMA DÍA
           ============================================= */
        :root {
            --bg-color: #fafafa;
            --text-color: #000000;
            --navbar-bg: #f5f5f5;
            --navbar-text: #000000;
            --gallery-bg: #f0f0f0;
            --btn-bg: #ff7227;
            --btn-text: #ffffff;
            --card-bg: #ffffff;
            --card-shadow: rgba(0,0,0,0.08);
            --feature-bg: #e9ecef;
            --split-bg: #f8f9fa;
            --footer-bg: #1a1a1a;
            --footer-text: #ffffff;
            --accent-color: #ff7227;
            --price-color: #28a745;
            --tag-bg: #ffe8d9;
            --tag-text: #cc5b00;
        }

        /* =============================================
           VARIABLES CSS - TEMA NOCHE
           ============================================= */
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #ffffff;
            --navbar-bg: #1a1a1a;
            --navbar-text: #ffffff;
            --gallery-bg: #252525;
            --btn-bg: #ff7227;
            --btn-text: #ffffff;
            --card-bg: #1e1e1e;
            --card-shadow: rgba(0,0,0,0.3);
            --feature-bg: #202020;
            --split-bg: #1a1a1a;
            --footer-bg: #0a0a0a;
            --footer-text: #ffffff;
            --accent-color: #ff7227;
            --price-color: #4ade80;
            --tag-bg: #3d2a1f;
            --tag-text: #ffb380;
        }

        /* =============================================
           RESET Y BASE
           ============================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Mochiy Pop One', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        img { max-width: 100%; display: block; }
        ul { list-style: none; }

        /* =============================================
           NAVBAR
           ============================================= */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 1200px;
            background: var(--navbar-bg);
            z-index: 1000;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .navbar:hover {
            box-shadow: 0 6px 30px rgba(0,0,0,0.15);
            transform: translateX(-50%) translateY(-2px);
        }

        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-links a {
            color: var(--navbar-text);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: var(--btn-bg);
            color: var(--btn-text);
            transform: translateY(-2px);
        }

        /* =============================================
           BOTÓN TEMA DÍA/NOCHE
           ============================================= */
        .theme-toggle {
            background: transparent;
            border: 2px solid var(--navbar-text);
            color: var(--navbar-text);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
            margin-left: 15px;
        }

        .theme-toggle:hover {
            background: var(--btn-bg);
            color: var(--btn-text);
            transform: rotate(15deg) scale(1.1);
            border-color: var(--btn-bg);
        }

        .theme-toggle .icon-sun { display: none; }
        .theme-toggle .icon-moon { display: block; }
        body.dark-mode .theme-toggle .icon-sun { display: block; }
        body.dark-mode .theme-toggle .icon-moon { display: none; }

        /* =============================================
           HERO CARRUSEL
           ============================================= */
        .hero-carousel {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            margin-top: 0;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
        }

        .slide.active { opacity: 1; }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            z-index: 1;
        }

        .slide-content {
            position: relative;
            z-index: 2;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            padding: 20px;
            max-width: 90%;
        }

        .slide-content.center {
            align-self: center;
            justify-self: center;
            text-align: center;
            margin: auto;
            width: 100%;
        }

        .slide-content.top-left {
            align-self: flex-start;
            justify-self: flex-start;
            text-align: left;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .slide-content.top-right {
            align-self: flex-start;
            justify-self: flex-end;
            text-align: right;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .slide-content.bottom-left {
            align-self: flex-end;
            justify-self: flex-start;
            text-align: left;
            position: absolute;
            bottom: 20px;
            left: 20px;
        }

        .slide-content.bottom-right {
            align-self: flex-end;
            justify-self: flex-end;
            text-align: right;
            position: absolute;
            bottom: 20px;
            right: 20px;
        }

        .slide-content h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            text-transform: uppercase;
            line-height: 1.2;
            word-wrap: break-word;
        }

        .slide-content h1 a {
            color: #fff;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .slide-content h1 a:hover { opacity: 0.8; }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            font-size: 30px;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 50%;
            font-family: 'Mochiy Pop One', sans-serif;
        }

        .carousel-btn:hover { background: rgba(255,255,255,0.6); }
        .prev { left: 20px; }
        .next { right: 20px; }

        /* =============================================
           FEATURES
           ============================================= */
        .features-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 60px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .feature-block {
            padding: 40px 20px;
            text-align: center;
            border-radius: 20px;
            background-color: var(--feature-bg);
            transition: transform 0.3s, background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .feature-block:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .feature-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            object-fit: contain;
        }

        .feature-block p { font-size: 1.1rem; }

        /* =============================================
           GALERÍA
           ============================================= */
        .gallery-section {
            padding: 60px 0;
            background: var(--gallery-bg);
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .gallery-section h2 { margin-bottom: 30px; font-size: 2rem; }

        .gallery-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 20px;
            gap: 15px;
            scrollbar-width: thin;
        }

        .gallery-container::-webkit-scrollbar { height: 8px; }
        .gallery-container::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }

        .gallery-item {
            flex: 0 0 300px;
            scroll-snap-align: center;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
