<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galería de imágenes - Descubre nuestros mejores momentos">
    <title>Mi Sitio Web - Galería</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">

    <style>
        /* === VARIABLES === */
        :root {
            --bg-color: #fafafa; --text-color: #000000; --navbar-bg: #f5f5f5; --navbar-text: #000000;
            --btn-bg: #ff7227; --btn-text: #ffffff; --card-bg: #ffffff; --card-shadow: rgba(0,0,0,0.08);
            --footer-bg: #1a1a1a; --footer-text: #ffffff; --filter-bg: #e9ecef;
        }
        body.dark-mode {
            --bg-color: #121212; --text-color: #ffffff; --navbar-bg: #1a1a1a; --navbar-text: #ffffff;
            --card-bg: #1e1e1e; --card-shadow: rgba(0,0,0,0.3); --footer-bg: #0a0a0a; --filter-bg: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Mochiy Pop One', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; transition: background-color 0.3s, color 0.3s; min-height: 100vh; display: flex; flex-direction: column; }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        img { max-width: 100%; display: block; }
        ul { list-style: none; }

        /* === NAVBAR === */
        .navbar { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 1200px; background: var(--navbar-bg); z-index: 1000; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; border-radius: 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); transition: all 0.3s; }
        .navbar:hover { box-shadow: 0 6px 30px rgba(0,0,0,0.15); transform: translateX(-50%) translateY(-2px); }
        .nav-links { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .nav-links a { color: var(--navbar-text); font-weight: bold; text-transform: uppercase; font-size: 13px; padding: 8px 16px; border-radius: 25px; }
        .nav-links a:hover { background: var(--btn-bg); color: var(--btn-text); transform: translateY(-2px); }
        .theme-toggle { background: transparent; border: 2px solid var(--navbar-text); color: var(--navbar-text); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-left: 15px; transition: 0.3s; }
        .theme-toggle:hover { background: var(--btn-bg); color: var(--btn-text); transform: rotate(15deg) scale(1.1); border-color: var(--btn-bg); }
        .theme-toggle .icon-sun { display: none; } .theme-toggle .icon-moon { display: block; }
        body.dark-mode .theme-toggle .icon-sun { display: block; } body.dark-mode .theme-toggle .icon-moon { display: none; }

        /* === HERO === */
        .gallery-hero { position: relative; height: 50vh; min-height: 350px; width: 100%; overflow: hidden; margin-top: 0; }
        .gallery-hero img { width: 100%; height: 100%; object-fit: cover; position: absolute; z-index: 1; }
        .gallery-hero::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%); z-index: 2; }
        .gallery-hero-content { position: relative; z-index: 3; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #fff; padding: 20px; }
        .gallery-hero-content h1 { font-size: clamp(2rem, 5vw, 4rem); text-transform: uppercase; margin-bottom: 15px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .gallery-hero-content p { font-size: clamp(1rem, 2vw, 1.2rem); max-width: 600px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }

        /* === FILTROS === */
        .gallery-filters { padding: 30px 20px; max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .filter-btn { padding: 10px 24px; background: var(--filter-bg); color: var(--text-color); border: 2px solid transparent; border-radius: 25px; font-family: inherit; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .filter-btn:hover, .filter-btn.active { background: var(--btn-bg); color: var(--btn-text); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,114,39,0.3); }

        /* === GRID DE GALERÍA === */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto 60px;
            padding: 0 20px;
        }

        .gallery-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--card-shadow);
            transition: transform 0.3s, box-shadow 0.3s;
            aspect-ratio: 1 / 1;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
            padding: 20px;
            color: white;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gallery-item:hover .gallery-item-overlay {
            opacity: 1;
        }

        .gallery-item-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .gallery-item-date {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .gallery-loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* === LIGHTBOX === */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .lightbox.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }

        .lightbox-info {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
        }

        .lightbox-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--btn-bg);
        }

        .lightbox-description {
            font-size: 1rem;
            line-height: 1.6;
            opacity: 0.9;
        }

        .lightbox-date {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 10px;
        }

        .lightbox-close {
            position: absolute;
            top: -50px;
            right: 0;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-close:hover {
            transform: rotate(90deg) scale(1.1);
            background: #ff8c42;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-nav:hover {
            background: rgba(255,255,255,0.4);
            transform: translateY(-50%) scale(1.1);
        }

        .lightbox-prev {
            left: -70px;
        }

        .lightbox-next {
            right: -70px;
        }

        /* === FOOTER === */
        footer { background: var(--footer-bg); color: var(--footer-text); text-align: center; padding: 50px 20px; margin: auto 20px 20px; border-radius: 30px; font-size: 0.95rem; margin-top: auto; }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .navbar { top: 10px; width: calc(100% - 20px); flex-direction: column; height: auto; padding: 15px; border-radius: 30px; }
            .nav-links { margin: 15px 0; gap: 10px; } .nav-links a { padding: 6px 12px; font-size: 11px; } .theme-toggle { margin: 10px auto 0; }
            .gallery-hero { height: 40vh; min-height: 280px; } .gallery-hero-content h1 { font-size: 2rem; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
            footer { margin: 40px 10px 10px; border-radius: 20px; }
            
            .lightbox-prev { left: 10px; }
            .lightbox-next { right: 10px; }
            .lightbox-close { top: 10px; right: 10px; }
            .lightbox-info { padding: 20px; }
            .lightbox-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="/index">Inicio</a></li>
            <li><a href="/about">Nosotros</a></li>
            <li><a href="/destinations">Destinos</a></li>
            <li><a href="/gallery" style="background:var(--btn-bg);color:var(--btn-text);">Galería</a></li>
            <li><a href="/contact">Contacto</a></li>
            <li><a href="/blog">Blog</a></li>
        </ul>
        <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
            <span class="icon-sun">☀️</span><span class="icon-moon">🌙</span>
        </button>
    </nav>

    <!-- HERO -->
    <section class="gallery-hero">
        <img src="Images/gallery/hero-gallery.jpg" alt="Galería de Imágenes">
        <div class="gallery-hero-content">
            <h1>📸 Nuestra Galería</h1>
            <p>Momentos capturados en nuestros viajes por Chile y el mundo</p>
        </div>
    </section>

    <!-- FILTROS -->
    <section class="gallery-filters">
        <button class="filter-btn active" data-filter="all">✨ Todas</button>
        <button class="filter-btn" data-filter="paisaje">🏞️ Paisajes</button>
        <button class="filter-btn" data-filter="montaña">⛰️ Montañas</button>
        <button class="filter-btn" data-filter="ciudad">🏙️ Ciudades</button>
        <button class="filter-btn" data-filter="aventura">🎯 Aventura</button>
        <button class="filter-btn" data-filter="relax">🧘 Relax</button>
    </section>

    <!-- GRID DE GALERÍA -->
    <main class="gallery-grid" id="galleryGrid">
        <div class="gallery-loading" id="galleryLoading">Cargando galería... 📸</div>
    </main>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose" aria-label="Cerrar">×</button>
            <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Anterior">‹</button>
            <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Siguiente">›</button>
            
            <img src="" alt="" class="lightbox-image" id="lightboxImage">
            
            <div class="lightbox-info">
                <h3 class="lightbox-title" id="lightboxTitle"></h3>
                <p class="lightbox-description" id="lightboxDescription"></p>
                <p class="lightbox-date" id="lightboxDate"></p>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        // === TEMA DÍA/NOCHE ===
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        if (localStorage.getItem('theme') === 'dark') body.classList.add('dark-mode');
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
        });

        // === VARIABLES GLOBALES ===
        let allGalleryImages = [];
        let currentFilter = 'all';
        let currentImageIndex = 0;
        let filteredImages = [];

        // === FORMATEAR FECHA ===
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('es-ES', { 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric' 
            });
        }

        // === CARGAR GALERÍA DESDE JSON ===
        async function loadGallery() {
            const grid = document.getElementById('galleryGrid');
            const loading = document.getElementById('galleryLoading');
            
            try {
                const response = await fetch('gallery/gallery.json');
                if (!response.ok) throw new Error('No se pudo cargar gallery.json');
                
                allGalleryImages = await response.json();
                
                // Ordenar por fecha (más recientes primero)
                allGalleryImages.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                loading.style.display = 'none';
                
                renderGallery(allGalleryImages);
                setupFilters();
                
            } catch (error) {
                console.error('Error:', error);
                loading.textContent = 'Error cargando galería. Intenta recargar. ❌';
            }
        }

        // === RENDERIZAR GALERÍA ===
        function renderGallery(images) {
            const grid = document.getElementById('galleryGrid');
            
            if (images.length === 0) {
                grid.innerHTML = '<div class="gallery-loading">No hay imágenes en esta categoría 📷</div>';
                return;
            }
            
            grid.innerHTML = images.map((img, index) => `
                <div class="gallery-item" data-index="${index}" data-category="${img.category}">
                    <img src="${img.image}" alt="${img.title}" loading="lazy">
                    <div class="gallery-item-overlay">
                        <div class="gallery-item-title">${img.title}</div>
                        <div class="gallery-item-date">${formatDate(img.date)}</div>
                    </div>
                </div>
            `).join('');
            
            // Guardar imágenes filtradas para el lightbox
            filteredImages = images;
            
            // Añadir listeners a las imágenes
            setupImageClicks();
        }

        // === CONFIGURAR CLICKS EN IMÁGENES ===
        function setupImageClicks() {
            document.querySelectorAll('.gallery-item').forEach(item => {
                item.addEventListener('click', () => {
                    const index = parseInt(item.dataset.index);
                    openLightbox(index);
                });
            });
        }

        // === ABRIR LIGHTBOX ===
        function openLightbox(index) {
            currentImageIndex = index;
            const lightbox = document.getElementById('lightbox');
            const img = filteredImages[index];
            
            document.getElementById('lightboxImage').src = img.image;
            document.getElementById('lightboxImage').alt = img.title;
            document.getElementById('lightboxTitle').textContent = img.title;
            document.getElementById('lightboxDescription').textContent = img.description;
            document.getElementById('lightboxDate').textContent = formatDate(img.date);
            
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // Evitar scroll del body
        }

        // === CERRAR LIGHTBOX ===
        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = ''; // Restaurar scroll
        }

        // === NAVEGAR LIGHTBOX ===
        function navigateLightbox(direction) {
            currentImageIndex += direction;
            
            if (currentImageIndex >= filteredImages.length) {
                currentImageIndex = 0;
            } else if (currentImageIndex < 0) {
                currentImageIndex = filteredImages.length - 1;
            }
            
            openLightbox(currentImageIndex);
        }

        // === CONFIGURAR FILTROS ===
        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    currentFilter = btn.dataset.filter;
                    
                    if (currentFilter === 'all') {
                        renderGallery(allGalleryImages);
                    } else {
                        const filtered = allGalleryImages.filter(img => img.category === currentFilter);
                        renderGallery(filtered);
                    }
                });
            });
        }

        // === EVENT LISTENERS DEL LIGHTBOX ===
        document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
        document.getElementById('lightboxPrev').addEventListener('click', () => navigateLightbox(-1));
        document.getElementById('lightboxNext').addEventListener('click', () => navigateLightbox(1));

        // Cerrar lightbox al hacer click fuera de la imagen
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') {
                closeLightbox();
            }
        });

        // Navegación con teclado
        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (!lightbox.classList.contains('active')) return;
            
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // === INICIALIZAR ===
        document.addEventListener('DOMContentLoaded', loadGallery);
    </script>
</body>
</html>
